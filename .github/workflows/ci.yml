name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  workspace:
    name: Bazzite-target Linux workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  qualification-artifact:
    name: Bazzite qualification artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - format
      - workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build qualification executables
        run: >-
          cargo build --locked --release -p romm-sync-cli
          --bin romm-m2-qualify --bin romm-m3-qualify --bin romm-sync
      - name: Smoke test qualification executables
        run: |
          target/release/romm-m2-qualify --help
          target/release/romm-m3-qualify --help
          target/release/romm-sync adapters
      - name: Package executable and verification metadata
        env:
          QUALIFICATION_COMMIT: ${{ github.sha }}
        run: |
          install -d -m 0755 dist/package
          install -m 0755 target/release/romm-m2-qualify dist/package/romm-m2-qualify
          printf 'commit=%s\ntarget=x86_64-unknown-linux-gnu\nrust=1.99.0\n' \
            "$QUALIFICATION_COMMIT" > dist/package/BUILD-INFO.txt
          cd dist/package
          sha256sum romm-m2-qualify > SHA256SUMS
          tar -czf ../romm-m2-qualify-linux-x86_64.tar.gz \
            BUILD-INFO.txt SHA256SUMS romm-m2-qualify
      - name: Package M3 executables and verification metadata
        env:
          QUALIFICATION_COMMIT: ${{ github.sha }}
        run: |
          install -d -m 0755 dist/m3
          install -m 0755 target/release/romm-m3-qualify dist/m3/romm-m3-qualify
          install -m 0755 target/release/romm-sync dist/m3/romm-sync
          printf 'commit=%s\ntarget=x86_64-unknown-linux-gnu\nrust=1.99.0\n' \
            "$QUALIFICATION_COMMIT" > dist/m3/BUILD-INFO.txt
          cd dist/m3
          sha256sum romm-m3-qualify romm-sync > SHA256SUMS
          tar -czf ../romm-m3-qualify-linux-x86_64.tar.gz \
            BUILD-INFO.txt SHA256SUMS romm-m3-qualify romm-sync
      - name: Publish qualification executable
        uses: actions/upload-artifact@v7
        with:
          path: dist/romm-m2-qualify-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Publish M3 qualification executables
        uses: actions/upload-artifact@v7
        with:
          path: dist/romm-m3-qualify-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

